<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Istoric Ollama (SQLite)</title>
<style>
  body {
    background: #1e1e1e;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  h1 {
    margin: 20px;
    color: #4a8cff;
  }

  #container {
    padding: 20px;
  }

  .entry {
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    background: #222;
  }

  .meta {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 8px;
  }

  .prompt {
    font-weight: bold;
    margin-bottom: 8px;
    white-space: pre-wrap;
  }

  .reply {
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<h1>Istoric conversații (SQLite)</h1>
<div id="container">Se încarcă...</div>

<script>
async function loadHistory() {
  const container = document.getElementById("container");
  container.innerHTML = "";

  try {
    const response = await fetch("http://localhost:3000/api/history");
    const rows = await response.json();

    if (!rows.length) {
      container.innerHTML = "Nu există înregistrări în istoric.";
      return;
    }

    rows.forEach(row => {
      const div = document.createElement("div");
      div.className = "entry";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `ID: ${row.id} | Model: ${row.model} | Timp: ${row.timestamp}`;

      const prompt = document.createElement("div");
      prompt.className = "prompt";
      prompt.textContent = "Tu: " + row.prompt;

      const reply = document.createElement("div");
      reply.className = "reply";
      reply.textContent = row.reply;

      div.appendChild(meta);
      div.appendChild(prompt);
      div.appendChild(reply);
      container.appendChild(div);
    });
  } catch (e) {
    container.innerHTML = "Eroare la încărcarea istoricului.";
    console.error(e);
  }
}

loadHistory();
</script>

</body>
</html>
